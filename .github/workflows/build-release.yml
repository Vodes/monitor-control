name: Build and release Stream Deck plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: streamdeck-monitor-control
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: streamdeck-monitor-control/package.json
          cache: true
          cache_dependency_path: streamdeck-monitor-control/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package, manifest, and release tag versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: pnpm run check:version

      - name: Check TypeScript
        run: pnpm check

      - name: Run plugin tests (mock-only)
        run: pnpm test

      - name: Build plugin
        run: pnpm build

      - name: Test backend and worker in PowerShell 7 (fake-only)
        run: |
          & ../tests/Test-MonitorControl.ps1
          & ./tests/Test-MonitorWorker.ps1

      - name: Test backend and worker in PowerShell 5.1 (fake-only)
        shell: powershell
        run: |
          & ../tests/Test-MonitorControl.ps1
          & ./tests/Test-MonitorWorker.ps1

      # Hosted runners have no physical monitors. Do not run smoke-worker.ts
      # or smoke-sdk.mjs here; their native enumeration is a local manual check.
      - name: Validate and package installer
        run: |
          pnpm validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run checksum

      - name: Upload installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: monitor-control
          path: |
            streamdeck-monitor-control/dist/*.streamDeckPlugin
            streamdeck-monitor-control/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: monitor-control
          path: dist

      - name: Verify downloaded installer checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/pw.vodes.monitorcontrol.streamDeckPlugin dist/SHA256SUMS.txt \
            --repo "$GH_REPO" --verify-tag --title "$RELEASE_TAG" --generate-notes
